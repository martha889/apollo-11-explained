name: Build and deploy the live viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: explained/requirements.txt
      - run: pip install -r explained/requirements.txt
      - name: Build the page from the simulations
        run: python explained/live/build.py
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp explained/live/apollo11_live.html _site/index.html
          cp explained/live/screenshot.png _site/
          mkdir -p _site/audio && cp explained/live/audio/*.mp3 _site/audio/
          touch _site/.nojekyll
          printf 'User-agent: *\nAllow: /\nSitemap: https://martha889.github.io/apollo-11-explained/sitemap.xml\n' > _site/robots.txt
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url>\n    <loc>https://martha889.github.io/apollo-11-explained/</loc>\n  </url>\n</urlset>\n' > _site/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
